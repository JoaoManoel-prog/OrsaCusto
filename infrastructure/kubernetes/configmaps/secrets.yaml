apiVersion: v1
kind: Secret
metadata:
  name: orsacusto-secrets
  labels:
    app: orsacusto
type: Opaque
stringData:
  # Database Configuration
  postgres-user: "orsacusto"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  database-connection-string: "Host=postgres-service;Port=5432;Database=orsacusto;Username=orsacusto;Password=CHANGE_ME_IN_PRODUCTION"
  
  # JWT Secret
  jwt-secret: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY"
  
  # Email SMTP Configuration
  smtp-host: "smtp.example.com"
  smtp-port: "587"
  smtp-username: "user@example.com"
  smtp-password: "CHANGE_ME_IN_PRODUCTION"
  
  # External API Keys
  storage-account-key: "CHANGE_ME_IN_PRODUCTION"
  
  # Encryption Keys
  data-encryption-key: "CHANGE_ME_IN_PRODUCTION_32_CHARS"
