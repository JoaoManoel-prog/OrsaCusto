apiVersion: apps/v1
kind: Deployment
metadata:
  name: orsacusto-frontend
  labels:
    app: orsacusto
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orsacusto
      component: frontend
  template:
    metadata:
      labels:
        app: orsacusto
        component: frontend
    spec:
      containers:
      - name: frontend
        image: orsacusto/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: orsacusto-config
              key: api-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: orsacusto-frontend-service
  labels:
    app: orsacusto
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: orsacusto
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
