name: Deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install docsify
        run: npm install docsify-cli -g

      - name: Build documentation site
        run: |
          mkdir -p docs-build
          cp README.md docs-build/index.md
          cp ARCHITECTURE.md docs-build/
          cp API_DOCUMENTATION.md docs-build/
          cp PROJECT_PLAN.md docs-build/
          cp IMPLEMENTATION_SUMMARY.md docs-build/
          cp QUICKSTART.md docs-build/
          cp CONTRIBUTING.md docs-build/

      - name: Create docsify config
        run: |
          cat > docs-build/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>OrsaCusto - Event Budget Platform</title>
            <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
            <meta name="description" content="Event budget management platform built with .NET and React">
            <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
            <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
            <style>
              :root {
                --base-font-size: 15px;
                --text-color: #333;
                --border-color: #ddd;
                --link-color: #0366D6;
                --link-active-color: #005CC5;
                --sidebar-background: #f5f5f5;
                --accent-color: #4CAF50;
              }
              .navbar {
                background-color: #2c3e50;
              }
              .navbar a {
                color: white !important;
              }
              .sidebar-nav li a {
                font-weight: 500;
              }
              h1 {
                color: #2c3e50;
                border-bottom: 3px solid #4CAF50;
              }
              h2 {
                color: #34495e;
                border-bottom: 2px solid #4CAF50;
              }
              .cover {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              }
              blockquote {
                border-left: 4px solid #4CAF50;
                background: #f5f5f5;
              }
              code {
                background: #f4f4f4;
                border-radius: 3px;
                padding: 2px 6px;
              }
              pre {
                background: #2c3e50 !important;
              }
            </style>
          </head>
          <body>
            <div id="app"></div>
            <script>
              window.$docsify = {
                name: 'OrsaCusto',
                repo: 'https://github.com/JoaoManoel-prog/OrsaCusto',
                logo: 'https://via.placeholder.com/200x50/667eea/ffffff?text=OrsaCusto',
                coverpage: true,
                onlyCover: false,
                loadSidebar: 'sidebar.md',
                loadNavbar: 'navbar.md',
                subMaxLevel: 3,
                auto2top: true,
                search: {
                  maxAge: 86400000,
                  paths: 'auto',
                  placeholder: 'Search documentation...',
                  noData: 'No results found.',
                  depth: 4
                },
                plugins: [
                  function(hook) {
                    hook.beforeEach(function(html) {
                      return html + '\n---\n' + 
                        '<lastmod>' + new Date().toLocaleDateString() + '</lastmod>';
                    });
                  }
                ]
              };
            </script>
            <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
          </body>
          </html>
          EOF

      - name: Create sidebar
        run: |
          cat > docs-build/sidebar.md << 'EOF'
          * [Home](/)
          * [README](README.md)
          * Getting Started
            * [Quick Start](QUICKSTART.md)
            * [Architecture](ARCHITECTURE.md)
          * Development
            * [API Documentation](API_DOCUMENTATION.md)
            * [Implementation](IMPLEMENTATION_SUMMARY.md)
            * [Contributing](CONTRIBUTING.md)
          * [Project Plan](PROJECT_PLAN.md)
          EOF

      - name: Create navbar
        run: |
          cat > docs-build/navbar.md << 'EOF'
          * [GitHub](https://github.com/JoaoManoel-prog/OrsaCusto)
          * [Code](https://github.com/JoaoManoel-prog/OrsaCusto)
          EOF

      - name: Create cover page
        run: |
          cat > docs-build/_coverpage.md << 'EOF'
          ![logo](https://via.placeholder.com/100/667eea/ffffff?text=Orsa)
          
          # OrsaCusto
          
          > Event Budget Management Platform
          
          A scalable event budget management system built with .NET 8 and React, featuring real-time collaboration, advanced analytics, and containerized deployment.
          
          * 🚀 Modern Architecture - .NET 8 + React + PostgreSQL
          * 📊 Advanced Analytics - Real-time budget tracking
          * ☁️ Cloud Ready - Docker & Kubernetes ready
          * 🔐 Enterprise Security - Built with best practices
          
          [Get Started](/QUICKSTART.md)
          [View on GitHub](https://github.com/JoaoManoel-prog/OrsaCusto)
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'docs-build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
